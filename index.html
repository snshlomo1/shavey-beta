    else add('עדיין לא תורכם. עכשיו תור משפחת '+((S.bt&&S.bt.current)||''));
  }else if(p.sold&&!p.occ)add('מגרש לא זמין');
  if(p.bmine&&me&&me.canCancel){const c=document.createElement('button');c.type='button';c.className='btn d';c.textContent='בטל את הבחירה שלי';c.onclick=async()=>{c.disabled=true;try{const r=await (await fetch(API+'?action=b_cancel&code='+encodeURIComponent(FCODE))).json();toast(r.ok?'הבחירה בוטלה':bMsg(r))}catch(e){toast('הפעולה נכשלה')}await loadBeta();S.sel=null;renderModal();render()};bd.appendChild(c)}
  m.append(mh,bd);bg.appendChild(m);host.appendChild(bg);
}
const famList=()=>((S.bt&&S.bt.fams)||[]).map(f=>({code:f.code,name:f.name}));
async function famSet(list){try{const r=await (await fetch(API+'?action=b_setfam&admin='+encodeURIComponent(ADM)+'&data='+encodeURIComponent(JSON.stringify(list)))).json();if(r.ok){S.bt=r;S.famEdit=false}else toast(r.reason==='chosen'?'אי אפשר למחוק או להזיז משפחה שכבר בחרה':'הפעולה נכשלה')}catch(e){toast('הפעולה נכשלה')}render()}
function moveFam(dragCode,targetCode,before){
  const fams=S.bt.fams,list=famList(),slots=[];
  fams.forEach((f,i)=>{if(!f.plot)slots.push(i)});
  const U=slots.map(i=>list[i]);
  const di=U.findIndex(x=>x.code===dragCode);if(di<0)return;
  const item=U.splice(di,1)[0];
  let ti=U.findIndex(x=>x.code===targetCode);if(ti<0)return;if(!before)ti++;
  U.splice(ti,0,item);
  slots.forEach((s,k)=>{list[s]=U[k]});
  famSet(list);
}
const icoBtn='border:none;background:transparent;border-radius:8px;cursor:pointer;font:inherit;font-size:15px;min-width:30px;height:30px;padding:0 6px;color:#475569';
function renderFam(){
  const host=$('listSec');
  if((S.famEdit||S.dragging)&&host.querySelector('input,textarea'))return;
  host.textContent='';
  const bt=S.bt||{},fams=bt.fams||[];
  const cur=fams.findIndex(x=>!x.plot),done=fams.filter(x=>x.plot).length;
  const wrap=document.createElement('div');wrap.style.cssText='max-width:560px;margin:0 auto;padding:4px 0 24px';
  const hdr=document.createElement('div');hdr.style.cssText='display:flex;justify-content:space-between;align-items:baseline;margin:6px 4px 10px';
  const tt=document.createElement('div');
  const t1=document.createElement('span');t1.textContent='סדר התור';t1.style.cssText='font-weight:800;font-size:17px';
  const t2=document.createElement('span');t2.textContent=fams.length?'  ·  נבחרו '+done+' מתוך '+fams.length:'';t2.style.cssText='font-size:13px;color:#64748b';
  tt.append(t1,t2);
  const all=document.createElement('button');all.type='button';all.style.cssText=smallBtn+';font-size:13px;padding:5px 10px';all.textContent='העתק את כל הקישורים';
  all.onclick=()=>copyTxt(fams.map(f=>f.name+': '+location.origin+location.pathname+'?f='+f.code).join('\n'),'כל הקישורים הועתקו');
  hdr.append(tt);if(fams.length)hdr.append(all);
  wrap.appendChild(hdr);
  const bar=document.createElement('div');bar.style.cssText='display:flex;gap:6px;align-items:center;margin:0 0 6px';
  const ni=document.createElement('input');ni.type='text';ni.placeholder='הוספת משפחה לסוף התור…';ni.maxLength=40;
  ni.style.cssText='flex:1;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box';
  const nb=document.createElement('button');nb.type='button';nb.style.cssText=smallBtn;nb.textContent='הוסף';
  const bulk=document.createElement('button');bulk.type='button';bulk.style.cssText=smallBtn;bulk.textContent='רשימה';bulk.title='הדבקת כמה שמות בבת אחת';
  const add1=()=>{const v=ni.value.trim();if(!v)return;famSet(famList().concat([{name:v}]))};
  nb.onclick=add1;ni.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add1()}};
  ni.oninput=()=>{S.famEdit=true};ni.onblur=()=>{S.famEdit=!!ni.value.trim()};
  bar.append(ni,nb,bulk);wrap.appendChild(bar);
  const bp=document.createElement('div');bp.style.cssText='display:none;margin:0 0 8px';
  const ta=document.createElement('textarea');ta.id='famTa';ta.rows=6;ta.placeholder='שורה לכל משפחה';ta.style.cssText='width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;box-sizing:border-box;margin-bottom:6px';
  const tb=document.createElement('button');tb.type='button';tb.style.cssText=smallBtn;tb.textContent='הוסף את כולן';
  tb.onclick=()=>{const names=ta.value.split('\n').map(s=>s.trim()).filter(Boolean);if(names.length)famSet(famList().concat(names.map(n=>({name:n}))))};
  ta.oninput=()=>{S.famEdit=true};ta.onblur=()=>{S.famEdit=!!ta.value.trim()};
  bp.append(ta,tb);bulk.onclick=()=>{bp.style.display=bp.style.display==='none'?'block':'none';if(bp.style.display==='block')ta.focus()};
  wrap.appendChild(bp);
  if(!fams.length){const e=document.createElement('div');e.textContent='עוד אין משפחות. הוסיפו משפחה או הדביקו רשימה.';e.style.cssText='color:#64748b;padding:18px 4px';wrap.appendChild(e);host.appendChild(wrap);return}
  const tl=document.createElement('div');tl.style.cssText='position:relative;padding:4px 0';
  if(fams.length>1){const ln=document.createElement('div');ln.style.cssText='position:absolute;right:19px;top:24px;bottom:24px;width:2px;background:#e2e8f0';tl.appendChild(ln)}
  fams.forEach((f,i)=>{
    const chosen=!!f.plot,isCur=i===cur;
    const row=document.createElement('div');
    const base=isCur?'#eef2ff':'transparent';
    row.style.cssText='position:relative;display:flex;align-items:center;gap:10px;padding:5px 4px;border-radius:12px;background:'+base;
    row.onmouseenter=()=>{if(!isCur)row.style.background='#f8fafc'};row.onmouseleave=()=>{row.style.background=base};
    const node=document.createElement('span');
    node.style.cssText='flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;box-sizing:border-box;position:relative;z-index:1;'+(chosen?'background:#16a34a;color:#fff':isCur?'background:#4f46e5;color:#fff':'background:#fff;border:2px solid #cbd5e1;color:#64748b');
    node.textContent=chosen?'✓':String(i+1);
    const ni2=document.createElement('input');ni2.type='text';ni2.value=f.name;ni2.maxLength=40;
    ni2.style.cssText='flex:1;min-width:100px;border:1px solid transparent;background:transparent;font:inherit;font-size:15px;font-weight:600;padding:5px 8px;border-radius:8px';
    ni2.onfocus=()=>{S.famEdit=true;ni2.style.borderColor='#cbd5e1';ni2.style.background='#fff'};
    ni2.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ni2.blur()}if(e.key==='Escape'){ni2.value=f.name;ni2.blur()}};
    ni2.onblur=()=>{S.famEdit=false;ni2.style.borderColor='transparent';ni2.style.background='transparent';const v=ni2.value.trim();if(v&&v!==f.name){const list=famList();list[i].name=v;famSet(list)}};
    const st=document.createElement('span');st.style.cssText='font-size:12px;white-space:nowrap;color:'+(chosen?'#15803d':'#4338ca');
    st.textContent=chosen?'מגרש '+f.plot+(f.t?' · '+fmtT(f.t):''):(isCur?'התור עכשיו':'');
    const cp=document.createElement('button');cp.type='button';cp.style.cssText=icoBtn;cp.textContent='🔗';cp.title='העתק קישור';cp.onclick=()=>copyTxt(location.origin+location.pathname+'?f='+f.code,'הקישור של '+f.name+' הועתק');
    const rm=document.createElement('button');rm.type='button';rm.style.cssText=icoBtn;rm.textContent=chosen?'↩':'✕';rm.title=chosen?'בטל בחירה':'מחק';let armed=false;
    rm.onclick=async()=>{
      if(!armed){armed=true;rm.textContent='בטוח?';rm.style.cssText=icoBtn+';font-size:12px;color:#b91c1c;font-weight:700';setTimeout(()=>{armed=false;rm.textContent=chosen?'↩':'✕';rm.style.cssText=icoBtn},3000);return}
      if(chosen){try{const r=await (await fetch(API+'?action=b_reset&admin='+encodeURIComponent(ADM)+'&code='+encodeURIComponent(f.code))).json();if(r.ok){S.bt=r;toast('הבחירה של '+f.name+' בוטלה')}}catch(e){toast('הפעולה נכשלה')}render()}
      else{const list=famList();list.splice(i,1);famSet(list)}
    };
    const hd=document.createElement('span');hd.textContent=chosen?'🔒':'⋮⋮';hd.title=chosen?'משפחה שכבר בחרה – לא ניתן להזיז':'גרור לשינוי סדר';
    hd.style.cssText='flex:none;width:18px;text-align:center;color:#94a3b8;font-size:'+(chosen?'12px':'16px')+';'+(chosen?'':'cursor:grab;letter-spacing:-2px');
    row.append(node,ni2,st,cp,rm,hd);
    if(!chosen){
      row.draggable=true;
      row.ondragstart=e=>{if(e.target!==row){e.preventDefault();return}S.dragging=true;S.dragCode=f.code;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',f.code)}catch(_){}row.style.opacity='.4'};
      row.ondragend=()=>{S.dragging=false;S.dragCode=null;render()};
      row.ondragover=e=>{if(!S.dragCode||S.dragCode===f.code)return;e.preventDefault();const r=row.getBoundingClientRect();row.style.boxShadow=e.clientY<r.top+r.height/2?'0 -3px 0 #4f46e5':'0 3px 0 #4f46e5'};
      row.ondragleave=()=>{row.style.boxShadow=''};
      row.ondrop=e=>{e.preventDefault();row.style.boxShadow='';const r=row.getBoundingClientRect();const before=e.clientY<r.top+r.height/2;const dc=S.dragCode;S.dragging=false;S.dragCode=null;if(dc)moveFam(dc,f.code,before)};
    }
    tl.appendChild(row);
  });
  wrap.appendChild(tl);host.appendChild(wrap);
}
function loadStats(){fetch(API+'?action=stats&admin='+encodeURIComponent(ADM)).then(r=>r.json()).then(r=>{if(r&&r.ok){S.stats=r;renderNotice()}}).catch(()=>{})}
async function refresh(){
  try{const r=JSON.parse(await run('getAll'));S.remote=r;S.loaded=true;S.err=null;render();if(S.admin)loadStats();loadBeta()}
  catch(e){if(!S.loaded){S.err='לא ניתן לטעון שיבוצים כרגע. אפשר לרענן את העמוד.';render()}}
}
document.querySelectorAll('#viewseg button').forEach(x=>x.classList.toggle('on',x.dataset.v===S.view));
render();refresh();
if(ADM)fetch(API+'?action=whoami&admin='+encodeURIComponent(ADM)).then(r=>r.json()).then(r=>{S.admin=!!r.admin;if(!S.admin)ADM='';document.querySelectorAll('#viewseg [data-v=recent],#viewseg [data-v=fam]').forEach(rb=>rb.style.display=S.admin?'':'none');render();refresh()}).catch(()=>{});
setInterval(()=>{if(!document.hidden&&!S.sel&&!(S.view==='fam'&&S.famEdit))refresh()},8000);
</script>
